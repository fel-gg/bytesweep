name: Verify builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows frontends and native workers from source
        shell: pwsh
        run: |
          function Get-Sha256Hex([string] $Path) {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $stream = [System.IO.File]::OpenRead($Path)
              try { return ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-', '').ToLowerInvariant() }
              finally { $stream.Dispose() }
            } finally { $sha.Dispose() }
          }
          $zigVersion = '0.16.0'
          $zigExpected = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          $zigArchive = Join-Path $env:RUNNER_TEMP "zig-$zigVersion.zip"
          $zigRoot = Join-Path $env:RUNNER_TEMP 'zig-toolchain'
          Invoke-WebRequest -Uri "https://ziglang.org/download/$zigVersion/zig-x86_64-windows-$zigVersion.zip" -OutFile $zigArchive -TimeoutSec 120
          $zigActual = Get-Sha256Hex $zigArchive
          if ($zigActual -ne $zigExpected) { throw "Zig checksum mismatch: $zigActual" }
          New-Item -ItemType Directory -Path $zigRoot -Force | Out-Null
          tar.exe -xf $zigArchive -C $zigRoot
          $zig = Join-Path $zigRoot "zig-x86_64-windows-$zigVersion\zig.exe"

          $autoItVersion = '3.3.18.0'
          $autoItExpected = 'ceb666a993a9f62621c3a0d4ee602774b2e7f543de1f08ec0380632ee3f89beb'
          $autoItArchive = Join-Path $env:RUNNER_TEMP "autoit-v$autoItVersion.zip"
          $autoItRoot = Join-Path $env:RUNNER_TEMP 'autoit-toolchain'
          Invoke-WebRequest -Uri "https://www.autoitscript.com/autoit3/files/archive/autoit/autoit-v$autoItVersion.zip" -OutFile $autoItArchive -TimeoutSec 120
          $autoItActual = Get-Sha256Hex $autoItArchive
          if ($autoItActual -ne $autoItExpected) { throw "AutoIt checksum mismatch: $autoItActual" }
          Expand-Archive -LiteralPath $autoItArchive -DestinationPath $autoItRoot -Force
          $autoIt = Join-Path $autoItRoot 'install'

          $buildLog = Join-Path $env:RUNNER_TEMP 'bytesweep-build.log'
          $buildErr = Join-Path $env:RUNNER_TEMP 'bytesweep-build.err'
          $buildArgs = @('-NoProfile','-ExecutionPolicy','Bypass','-File',
            (Join-Path (Get-Location) 'tests\windows\Build.Tests.ps1'),
            '-AutoItRoot',$autoIt,'-ZigPath',$zig,'-OutputDirectory',(Join-Path (Get-Location) 'windows'))
          $buildProcess = Start-Process -FilePath 'powershell.exe' -ArgumentList $buildArgs -PassThru `
            -RedirectStandardOutput $buildLog -RedirectStandardError $buildErr
          try {
            if (-not $buildProcess.WaitForExit(600000)) {
              taskkill.exe /PID $buildProcess.Id /T /F | Out-Null
              throw 'Windows source build contract timed out after 600 seconds'
            }
            Get-Content -LiteralPath $buildLog -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $buildErr -ErrorAction SilentlyContinue
            if ($buildProcess.ExitCode -ne 0) { throw "Windows source build contract failed: $($buildProcess.ExitCode)" }
          }
          finally { $buildProcess.Dispose() }

          foreach ($worker in @('.\windows\ByteSweepWorker_x64.exe', '.\windows\ByteSweepWorker.exe')) {
            $probe = Start-Process -FilePath $worker -ArgumentList '/selftest' -Wait -PassThru
            if ($probe.ExitCode -ne 0) { throw "$worker self-test failed with $($probe.ExitCode)" }
            $measurement = Start-Process -FilePath $worker -ArgumentList '/measurement-selftest' -Wait -PassThru
            if ($measurement.ExitCode -ne 0) { throw "$worker measurement self-test failed with $($measurement.ExitCode)" }
            $launcher = Start-Process -FilePath $worker -ArgumentList '/launch-test' -Wait -PassThru
            if ($launcher.ExitCode -ne 0) { throw "$worker cannot locate its matching frontend" }
            $guard = Start-Process -FilePath $worker -ArgumentList '/profile=2','/result=guard.result' -Wait -PassThru
            if ($guard.ExitCode -ne 2) { throw "$worker accepted an implicit system-wide trim" }
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\windows\WorkerProtocol.Tests.ps1 -WorkerPath $worker
            if ($LASTEXITCODE -ne 0) { throw "$worker protocol v2 contract failed: $LASTEXITCODE" }
          }
      - name: Upload M0 Windows provenance
        uses: actions/upload-artifact@v4
        with:
          name: windows-m0-provenance
          path: |
            windows/BUILD-MANIFEST.json
            windows/M0-BASELINE.json
          if-no-files-found: error
      - name: Verify x64 self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\windows\ByteSweep_x64.exe -ArgumentList /RMSELFTEST -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "x64 self-test failed with exit code $($process.ExitCode)" }
          $monitor = Start-Process -FilePath .\windows\ByteSweep_x64.exe -ArgumentList /RMMONITORSELFTEST -Wait -PassThru
          if ($monitor.ExitCode -ne 0) { throw "x64 monitor logic failed with exit code $($monitor.ExitCode)" }
          $measurement = Start-Process -FilePath .\windows\ByteSweep_x64.exe -ArgumentList /RMMEASUREMENTSELFTEST -Wait -PassThru
          if ($measurement.ExitCode -ne 0) { throw "x64 measurement logic failed with exit code $($measurement.ExitCode)" }
          $lifecycle = Start-Process -FilePath .\windows\ByteSweep_x64.exe -ArgumentList /RMWORKERLIFECYCLESELFTEST -Wait -PassThru
          if ($lifecycle.ExitCode -ne 0) { throw "x64 worker lifecycle failed with exit code $($lifecycle.ExitCode)" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\windows\OptimizationLock.Tests.ps1 -FrontendPath .\windows\ByteSweep_x64.exe
          if ($LASTEXITCODE -ne 0) { throw "x64 optimization lock contention failed: $LASTEXITCODE" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\windows\WorkerParentDeath.Tests.ps1 -FrontendPath .\windows\ByteSweep_x64.exe
          if ($LASTEXITCODE -ne 0) { throw "x64 parent-death cleanup failed: $LASTEXITCODE" }
          Get-Process ByteSweep* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not [Environment]::UserInteractive) { Write-Warning 'Windows runner is headless; UI smoke is covered by local interactive evidence.'; exit 0 }
          $ui = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','.\tests\windows\UiSmoke.Tests.ps1','-FrontendPath','.\windows\ByteSweep_x64.exe' -PassThru
          if (-not $ui.WaitForExit(30000)) { taskkill.exe /PID $ui.Id /T /F; throw 'x64 UI smoke timed out' }
          $uiDiag = Join-Path $env:TEMP 'ByteSweep-UiSmoke-error.txt'
          if (Test-Path -LiteralPath $uiDiag) { Get-Content -LiteralPath $uiDiag }
          if ($ui.ExitCode -ne 0) { throw "x64 UI smoke failed with exit code $($ui.ExitCode); inspect UiSmoke.Tests.ps1 locally on an interactive desktop" }
      - name: Verify x86 self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\windows\ByteSweep.exe -ArgumentList /RMSELFTEST -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "x86 self-test failed with exit code $($process.ExitCode)" }
          $monitor = Start-Process -FilePath .\windows\ByteSweep.exe -ArgumentList /RMMONITORSELFTEST -Wait -PassThru
          if ($monitor.ExitCode -ne 0) { throw "x86 monitor logic failed with exit code $($monitor.ExitCode)" }
          $measurement = Start-Process -FilePath .\windows\ByteSweep.exe -ArgumentList /RMMEASUREMENTSELFTEST -Wait -PassThru
          if ($measurement.ExitCode -ne 0) { throw "x86 measurement logic failed with exit code $($measurement.ExitCode)" }
          $lifecycle = Start-Process -FilePath .\windows\ByteSweep.exe -ArgumentList /RMWORKERLIFECYCLESELFTEST -Wait -PassThru
          if ($lifecycle.ExitCode -ne 0) { throw "x86 worker lifecycle failed with exit code $($lifecycle.ExitCode)" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\windows\OptimizationLock.Tests.ps1 -FrontendPath .\windows\ByteSweep.exe
          if ($LASTEXITCODE -ne 0) { throw "x86 optimization lock contention failed: $LASTEXITCODE" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\windows\WorkerParentDeath.Tests.ps1 -FrontendPath .\windows\ByteSweep.exe
          if ($LASTEXITCODE -ne 0) { throw "x86 parent-death cleanup failed: $LASTEXITCODE" }
          Get-Process ByteSweep* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not [Environment]::UserInteractive) { Write-Warning 'Windows runner is headless; UI smoke is covered by local interactive evidence.'; exit 0 }
          $ui = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','.\tests\windows\UiSmoke.Tests.ps1','-FrontendPath','.\windows\ByteSweep.exe' -PassThru
          if (-not $ui.WaitForExit(30000)) { taskkill.exe /PID $ui.Id /T /F; throw 'x86 UI smoke timed out' }
          $uiDiag = Join-Path $env:TEMP 'ByteSweep-UiSmoke-error.txt'
          if (Test-Path -LiteralPath $uiDiag) { Get-Content -LiteralPath $uiDiag }
          if ($ui.ExitCode -ne 0) { throw "x86 UI smoke failed with exit code $($ui.ExitCode)" }
      - name: Verify real Windows working-set trim
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\windows\RealTrim.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Targeted Windows trim fixture failed: $LASTEXITCODE" }
      - name: Verify bounded Windows refault recovery
        shell: pwsh
        run: |
          $source = @'
          using System;
          using System.IO;
          using System.Threading;

          public static class ByteSweepRefaultTarget
          {
              public static void Main(string[] args)
              {
                  byte[] buffer = new byte[256 * 1024 * 1024];
                  for (int offset = 0; offset < buffer.Length; offset += 4096)
                      buffer[offset] = 1;
                  while (!File.Exists(args[0]))
                      Thread.Sleep(10);
                  for (int offset = 0; offset < buffer.Length; offset += 4096)
                      buffer[offset] = 2;
                  Thread.Sleep(TimeSpan.FromSeconds(30));
                  GC.KeepAlive(buffer);
              }
          }
          '@
          $targetExe = Join-Path $env:RUNNER_TEMP 'ByteSweepRefaultTarget.exe'
          $targetCs = Join-Path $env:RUNNER_TEMP 'ByteSweepRefaultTarget.cs'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $source | Set-Content -LiteralPath $targetCs -Encoding UTF8
          & $csc /nologo /target:exe "/out:$targetExe" $targetCs
          if ($LASTEXITCODE -ne 0) { throw 'Refault target compilation failed' }

          foreach ($worker in @('.\windows\ByteSweepWorker_x64.exe', '.\windows\ByteSweepWorker.exe')) {
            $signal = Join-Path $env:RUNNER_TEMP ("native-{0}.signal" -f [IO.Path]::GetFileName($worker))
            $result = Join-Path $env:RUNNER_TEMP ("native-{0}.result" -f [IO.Path]::GetFileName($worker))
            $target = Start-Process -FilePath $targetExe -ArgumentList $signal -WindowStyle Hidden -PassThru
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(15)
              do {
                if ($target.HasExited) { throw "$worker native target exited early" }
                $before = (Get-Process -Id $target.Id).WorkingSet64
                if ($before -ge 128MB) { break }
                Start-Sleep -Milliseconds 100
              } while ([DateTime]::UtcNow -lt $deadline)
              $session = [guid]::NewGuid().ToString('N')
              $handshake = "$result.ready"
              $probe = Start-Process -FilePath $worker -ArgumentList '/profile=2','/minimum-mb=4','/protocol=2',("/session=$session"),("/pid=$($target.Id)"),("/result=$result"),("/handshake=$handshake") -Wait -PassThru
              if ($probe.ExitCode -ne 0) { throw "$worker targeted trim failed with $($probe.ExitCode)" }
              $after = (Get-Process -Id $target.Id).WorkingSet64
              $fields = @(Get-Content -LiteralPath $result)
              if (-not ($fields -contains 'protocol=2') -or -not ($fields -contains "session=$session") -or -not ($fields -contains 'record_count=1')) { throw "$worker returned malformed targeted metrics" }
              $targetRecord = @($fields | Where-Object { $_ -like 'record=*' })
              $targetFields = @(($targetRecord[0].Substring(7)) -split '\|',7)
              if ($targetFields.Count -ne 7 -or $targetFields[5] -ne 'measured' -or ([int64]$targetFields[2] - [int64]$targetFields[3]) -lt 64MB) { throw "$worker omitted valid paired target metrics" }
              foreach ($metric in @('seen','protected','filtered','foreground','open_failed','path_failed','windows_process','query_failed','below_minimum','trim_failed','no_reduction','measured','unmeasured')) {
                if (-not ($fields -match "^$metric=\d+$")) { throw "$worker omitted taxonomy metric $metric" }
              }
              if ($before - $after -lt 64MB) { throw "$worker native reduction was too small" }
              if ($target.HasExited) { throw "$worker terminated its native target" }
            } finally {
              if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
            }
          }

          foreach ($binary in @('.\windows\ByteSweep_x64.exe', '.\windows\ByteSweep.exe')) {
            $signal = Join-Path $env:RUNNER_TEMP ("refault-{0}.signal" -f [IO.Path]::GetFileName($binary))
            $result = Join-Path $env:RUNNER_TEMP ("refault-{0}.result" -f [IO.Path]::GetFileName($binary))
            Remove-Item -LiteralPath $signal,$result -Force -ErrorAction SilentlyContinue
            $target = Start-Process -FilePath $targetExe -ArgumentList $signal -WindowStyle Hidden -PassThru
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(15)
              do {
                if ($target.HasExited) { throw "$binary refault target exited early" }
                $resident = (Get-Process -Id $target.Id).WorkingSet64
                if ($resident -ge 128MB) { break }
                Start-Sleep -Milliseconds 100
              } while ([DateTime]::UtcNow -lt $deadline)
              $probe = Start-Process -FilePath $binary -ArgumentList '/RMREFAULTTEST',$target.Id,$result,$signal -Wait -PassThru
              if ($probe.ExitCode -ne 0) { throw "$binary refault probe failed with $($probe.ExitCode)" }
              if ($target.HasExited) { throw "$binary terminated its refault target" }
              $values = @(Get-Content -LiteralPath $result | ForEach-Object { [int64]$_ })
              if ($values.Count -ne 6) { throw "$binary returned malformed refault metrics" }
              $before,$initial,$refaulted,$final,$recoveries,$refaults = $values
              if ($before - $initial -lt 64MB) { throw "$binary initial trim was too small" }
              if ($refaulted - $initial -lt 64MB) { throw "$binary fixture did not refault materially" }
              if ($refaulted - $final -lt 64MB) { throw "$binary recovery released too little" }
              if ($recoveries -ne 1) { throw "$binary recovery count was $recoveries instead of 1" }
              if ($refaults -lt 64) { throw "$binary did not observe enough page faults: $refaults" }
              Write-Output "$binary refaulted $([math]::Round(($refaulted-$initial)/1MB,1)) MB and recovered $([math]::Round(($refaulted-$final)/1MB,1)) MB"
            } finally {
              if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
            }
          }
      - name: Verify full Windows Aggressive engine
        # Never run against stale binaries after an earlier build/trim gate
        # failed; the resulting diagnostics would be misleading.
        if: ${{ success() }}
        shell: pwsh
        run: |
          $target = $null
          try {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            Write-Output "Aggressive runner elevated: $isAdmin"
            if (-not $isAdmin) {
              throw 'The disposable Aggressive integration gate requires an elevated Windows runner'
            }

            $targetSource = @'
            using System;
            using System.Threading;

            public static class ByteSweepAggressiveTarget
            {
                public static void Main()
                {
                    byte[] buffer = new byte[256 * 1024 * 1024];
                    for (int offset = 0; offset < buffer.Length; offset += 4096)
                        buffer[offset] = 1;
          Thread.Sleep(TimeSpan.FromSeconds(180));
                    GC.KeepAlive(buffer);
                }
            }
          '@
            $targetExe = Join-Path $env:RUNNER_TEMP 'ByteSweepAggressiveTarget.exe'
            $targetCs = Join-Path $env:RUNNER_TEMP 'ByteSweepAggressiveTarget.cs'
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            $targetSource | Set-Content -LiteralPath $targetCs -Encoding UTF8
            & $csc /nologo /target:exe "/out:$targetExe" $targetCs
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $targetExe)) {
              throw "Disposable Aggressive target compilation failed with exit code $LASTEXITCODE"
            }
            $target = Start-Process -FilePath $targetExe -WindowStyle Hidden -PassThru
            $resultPath = Join-Path $env:RUNNER_TEMP 'aggressive.result'
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              if ($target.HasExited) { throw 'Disposable Aggressive target exited before reclaim' }
              $resident = (Get-Process -Id $target.Id).WorkingSet64
              if ($resident -ge 128MB) { break }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($resident -lt 128MB) { throw 'Disposable Aggressive target never became resident' }

            $worker = Start-Process -FilePath .\windows\ByteSweep_x64.exe `
              -ArgumentList '/RMAGGRESSIVE',("/RMRESULT=$resultPath") -Wait -PassThru
            if ($worker.ExitCode -ne 0) { throw "Aggressive worker failed with exit code $($worker.ExitCode)" }
            if ($target.HasExited) { throw 'Aggressive terminated the disposable target' }

            $rawFields = @(Get-Content -LiteralPath $resultPath)
            if ($rawFields.Count -lt 27) { throw "Aggressive returned only $($rawFields.Count) result fields" }
            $fields = @($rawFields[0..15] | ForEach-Object { [int64]$_ })
            $trimOperations = $fields[1]
            $workingSetReduction = $fields[2]
            $nativeStages = $fields[3]
            $processPasses = $fields[4]
            $peakGain = $fields[6]
            $stableGain = $fields[7]
            $rebound = $fields[8]
            $recoveryPasses = $fields[9]
            $recoveryFaults = $fields[10]
            $measuredTargets = $fields[11]
            $unmeasuredTargets = $fields[12]
            $availableKnown = $fields[13]
            $peakKnown = $fields[14]
            $stableKnown = $fields[15]
            if ($trimOperations -lt 1) { throw 'Aggressive did not trim an eligible process' }
            if ($workingSetReduction -lt 16MB) { throw "Aggressive measured only $workingSetReduction bytes of working-set reduction" }
            if ($nativeStages -lt 4) { throw "Aggressive completed only $nativeStages of 7 native stages" }
            if ($processPasses -lt 2 -or $processPasses -gt 3) { throw "Aggressive completed unexpected process pass count: $processPasses" }
            if ($recoveryPasses -lt 0 -or $recoveryPasses -gt 1) { throw "Aggressive returned invalid recovery pass count: $recoveryPasses" }
            if ($recoveryFaults -lt 0) { throw "Aggressive returned invalid recovery page faults: $recoveryFaults" }
            if ($measuredTargets -lt 1 -or $unmeasuredTargets -lt 0) { throw 'Aggressive returned invalid target measurement counts' }
            foreach ($known in @($availableKnown,$peakKnown,$stableKnown)) {
              if ($known -notin @(0,1)) { throw 'Aggressive returned an invalid snapshot-known flag' }
            }
            foreach ($metric in @('seen','protected','filtered','foreground','open_failed','path_failed','windows_process','query_failed','below_minimum','trim_failed','no_reduction','measured','unmeasured')) {
              if (-not ($rawFields -match "^$metric=\d+$")) { throw "Aggressive omitted native taxonomy metric $metric" }
            }
            if ($rebound -lt 0) { throw 'Aggressive returned an invalid rebound metric' }
            Write-Output "Aggressive: $trimOperations trims, $([math]::Round($workingSetReduction / 1MB, 1)) MB working set, $nativeStages native stages, $processPasses passes, recovery=$recoveryPasses, rebound=$([math]::Round($rebound / 1MB, 1)) MB"
          } catch {
            $failure = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Output "::error title=Aggressive integration::$failure"
            throw
          } finally {
            if ($null -ne $target -and -not $target.HasExited) { Stop-Process -Id $target.Id -Force }
          }

  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bash syntax
        run: |
          bash -n linux/ByteSweep_Linux.sh
          bash -n linux/desktop/Install_Desktop.sh
          bash -n linux/server/Install_Server.sh
          bash -n tests/linux/capture_baseline.sh
          bash -n tests/linux/test_fixture_isolation.sh
          bash -n tests/linux/test_failure_adapter.sh
          bash -n tests/linux/test_session_accounting.sh
          bash -n tests/linux/test_installers.sh
          bash -n tests/linux/capture_hardware.sh
          bash -n tests/linux/mapping_benchmark.sh
          bash -n tests/linux/scope_matrix.sh
          python3 -m py_compile linux/native/bytesweep-native
          python3 -m py_compile tests/linux/mapping_fixture.py
          python3 -m py_compile tests/benchmark/run_benchmark.py tests/benchmark/summarize_benchmark.py tests/benchmark/workload_memory.py tests/benchmark/latency_probe.py tests/contracts/contract_harness.py tests/contracts/trial_controller.py tests/contracts/reclaim_plan.py tests/contracts/compatibility_harness.py tests/contracts/baseline_manifest.py tests/contracts/trial_config.py tests/contracts/decision_rules.py tests/contracts/abi_contract.py
          python3 -c 'import os, sys; sys.path.insert(0, "tests/benchmark"); import run_benchmark; assert run_benchmark.cpu_seconds(os.getpid()) is not None'
          python3 -m unittest discover -s tests/benchmark -p 'test_*.py'
          python3 -m unittest discover -s tests/contracts -p 'test_*.py'
          python3 tests/benchmark/latency_probe.py --command 'python3 tests/benchmark/workload_memory.py --megabytes 1 --seconds 0' --iterations 3 --timeout 5 --output "${RUNNER_TEMP}/latency-smoke.json"
          for pattern in private file-cache retouch hot new-allocation short-lived; do
            python3 tests/benchmark/workload_memory.py --megabytes 1 --seconds 0.05 --pattern "${pattern}"
          done
          python3 tests/linux/test_native_unit.py
          bash tests/linux/test_fixture_isolation.sh
          bash tests/linux/test_failure_adapter.sh
          bash tests/linux/test_session_accounting.sh
          bash tests/linux/test_installers.sh
      - name: Verify release workflow contract
        run: python3 -m unittest tests/release/test_release_workflow_contract.py
      - name: Capture Linux M0 provenance
        run: bash tests/linux/capture_baseline.sh "${RUNNER_TEMP}/linux-m0-baseline.txt"
      - name: Upload Linux M0 provenance
        uses: actions/upload-artifact@v4
        with:
          name: linux-m0-provenance
          path: ${{ runner.temp }}/linux-m0-baseline.txt
          if-no-files-found: error
      - name: Capture hardware provenance
        run: bash tests/linux/capture_hardware.sh "${RUNNER_TEMP}/hardware.txt"
      - name: Upload hardware provenance
        uses: actions/upload-artifact@v4
        with:
          name: hardware-${{ matrix.os }}
          path: ${{ runner.temp }}/hardware.txt
          if-no-files-found: error
      - name: Run Linux mapping grid
        run: |
          timeout 300s env MAPPING_REPEATS=5 MAPPING_SECONDS=2 \
            bash tests/linux/mapping_benchmark.sh "${RUNNER_TEMP}/mapping-grid.txt"
      - name: Upload Linux mapping grid
        uses: actions/upload-artifact@v4
        with:
          name: mapping-grid-${{ matrix.os }}
          path: ${{ runner.temp }}/mapping-grid.txt
          if-no-files-found: error
      - name: Capture scope matrix
        run: bash tests/linux/scope_matrix.sh "${RUNNER_TEMP}/scope-matrix.txt"
      - name: Upload scope matrix
        uses: actions/upload-artifact@v4
        with:
          name: scope-matrix-${{ matrix.os }}
          path: ${{ runner.temp }}/scope-matrix.txt
          if-no-files-found: error
      - name: Verify native Linux process page-out
        run: |
          native_check="$(linux/native/bytesweep-native check)"
          grep -F 'native_status=supported' <<< "${native_check}"

          mapped_file="${RUNNER_TEMP}/bytesweep-native-target.bin"
          ready_file="${RUNNER_TEMP}/bytesweep-native-ready"
          python3 -c '
          import mmap, pathlib, sys, time
          path, ready = sys.argv[1], sys.argv[2]
          size = 128 * 1024 * 1024
          with open(path, "w+b") as target:
              target.truncate(size)
              with mmap.mmap(target.fileno(), size) as mapped:
                  checksum = 0
                  for offset in range(0, size, 4096):
                      checksum ^= mapped[offset]
                  pathlib.Path(ready).write_text(str(checksum))
                  time.sleep(60)
          ' "${mapped_file}" "${ready_file}" &
          target_pid=$!
          trap 'kill "${target_pid}" 2>/dev/null || true; wait "${target_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..300}; do
            test -f "${ready_file}" && break
            sleep 0.1
          done
          test -f "${ready_file}"
          rss_before="$(awk '/^VmRSS:/ { print $2 }' "/proc/${target_pid}/status")"
          native_exit=0
          native_output="$(sudo linux/native/bytesweep-native pageout \
            --pid "${target_pid}" --min-rss-mb 1 --min-mapping-kb 64 \
            --activity-ms 0 --settle-ms 750)" || native_exit=$?
          printf '%s\n' "${native_output}"
          test "${native_exit}" -eq 0
          rss_after="$(awk '/^VmRSS:/ { print $2 }' "/proc/${target_pid}/status")"
          bytes_advised="$(awk -F= '$1 == "bytes_advised" { print $2 }' <<< "${native_output}")"
          rss_reduced="$(awk -F= '$1 == "rss_reduced_kb" { print $2 }' <<< "${native_output}")"
          batch_calls="$(awk -F= '$1 == "batch_calls" { print $2 }' <<< "${native_output}")"

          grep -E '^native_status=(done|partial)$' <<< "${native_output}"
          test "${bytes_advised}" -gt 0
          test "${rss_reduced}" -gt 16384
          test "${batch_calls}" -gt 0
          test "${rss_after}" -lt "${rss_before}"

          protected_output="$(sudo linux/native/bytesweep-native pageout \
            --pid "${target_pid}" --min-rss-mb 1 --activity-ms 0 --settle-ms 0 \
            --protect-pattern bytesweep-native-target.bin)"
          grep -F 'native_status=no_candidates' <<< "${protected_output}"
          grep -F 'workloads_protected=1' <<< "${protected_output}"
          kill "${target_pid}"
          wait "${target_pid}" || true
          trap - EXIT
      - name: Verify targeted Linux launcher reclaim
        run: |
          target_log="${RUNNER_TEMP}/bytesweep-target.log"
          python3 tests/benchmark/workload_memory.py --megabytes 96 --seconds 30 --pattern private >"${target_log}" 2>&1 &
          target_pid=$!
          trap 'kill "${target_pid}" 2>/dev/null || true; wait "${target_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..300}; do
            grep -q '^pid=' "${target_log}" && break
            sleep 0.1
          done
          if ! test -s "${target_log}"; then
            echo 'Target workload did not publish output within 30 seconds.'
            cat "${target_log}" 2>/dev/null || true
            ps -o pid,stat,cmd -p "${target_pid}" || true
            exit 1
          fi
          set +e
          output="$(timeout 30s sudo env BYTESWEEP_TARGET_PID="${target_pid}" BYTESWEEP_RECLAIM_MB=64 ./linux/ByteSweep_Linux.sh aggressive 2>&1)"
          launcher_exit=$?
          set -e
          printf '%s\n' "${output}"
          printf 'Targeted launcher exit: %s\n' "${launcher_exit}"
          test "${launcher_exit}" -eq 0
          grep -F 'Mode                    : aggressive' <<< "${output}"
          grep -E '^Native process page-out : pass[0-9]+=' <<< "${output}"
          grep -E 'Processes scanned       : [1-9][0-9]*' <<< "${output}"
          grep -E 'Mappings advised        : [1-9][0-9]*' <<< "${output}"
          kill "${target_pid}" 2>/dev/null || true
          wait "${target_pid}" 2>/dev/null || true
          trap - EXIT
      - name: Run safe Linux self-check
        run: |
          check_output="$(./linux/ByteSweep_Linux.sh check)"
          grep -F 'Mode                    : check' <<< "${check_output}"
          grep -F 'File cache released     :' <<< "${check_output}"
          grep -F 'Anonymous RAM change    :' <<< "${check_output}"
          grep -F 'Swap current            :' <<< "${check_output}"
          grep -F 'Default Aggressive ask  :' <<< "${check_output}"
          grep -F 'Native process page-out : supported' <<< "${check_output}"
          grep -F 'cgroup memory.reclaim   :' <<< "${check_output}"
      - name: Exercise native Smooth and Aggressive paths
        run: |
          mock_root="${RUNNER_TEMP}/bytesweep-kernel-mock"
          mkdir -p "${mock_root}/vm" "${mock_root}/cgroup"
          cat > "${mock_root}/meminfo" <<'EOF'
          MemTotal:       16777216 kB
          MemAvailable:   10485760 kB
          Cached:          2097152 kB
          SReclaimable:     262144 kB
          Shmem:             65536 kB
          AnonPages:       4194304 kB
          SwapTotal:       4194304 kB
          SwapFree:        3145728 kB
          EOF
          : > "${mock_root}/vm/drop_caches"
          : > "${mock_root}/cgroup/memory.reclaim"
          cat > "${mock_root}/bytesweep-native" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "reclaim" ]]; then
            session=""; path=""; bytes=""; swappiness="default"; previous=""
            for argument in "$@"; do
              [[ "${previous}" == "--session" ]] && session="${argument}"
              [[ "${previous}" == "--path" ]] && path="${argument}"
              [[ "${previous}" == "--bytes" ]] && bytes="${argument}"
              [[ "${previous}" == "--swappiness" ]] && swappiness="${argument}"
              previous="${argument}"
            done
            payload="${bytes}"
            [[ "${swappiness}" != "default" ]] && payload+=" swappiness=${swappiness}"
            printf '%s' "${payload}" > "${path}"
            printf 'protocol=2\nsession=%s\nnative_status=done\n' "${session}"
            exit 0
          fi
          if [[ "${1:-}" == "check" ]]; then
            printf 'native_status=supported\n'
            exit 0
          fi
          session=""
          previous=""
          for argument in "$@"; do
            [[ "${previous}" == "--session" ]] && session="${argument}"
            previous="${argument}"
          done
          printf 'protocol=2\nsession=%s\n' "${session}"
          if [[ -n "${BYTESWEEP_TEST_ARGS_FILE:-}" ]]; then
            printf '%s\n' "$@" > "${BYTESWEEP_TEST_ARGS_FILE}"
            chmod 0644 "${BYTESWEEP_TEST_ARGS_FILE}"
          fi
          cat <<'RESULT'
          native_status=done
          processes_seen=12
          processes_advised=4
          processes_active_skipped=3
          processes_protected=2
          workloads_protected=2
          mappings_advised=28
          bytes_advised=536870912
          rss_reduced_kb=393216
          rss_delta_kb=393216
          rss_measured_targets=1
          rss_unmeasured_targets=0
          rss_exited_targets=0
          rss_identity_mismatch_targets=0
          rss_permission_denied_targets=0
          rss_target=4242|524288|131072|measured
          batch_calls=3
          fallback_calls=0
          RESULT
          EOF
          chmod +x "${mock_root}/bytesweep-native"
          cat > "${mock_root}/fake-sync" <<'EOF'
          #!/usr/bin/env bash
          printf 'sync\n' >> "${BYTESWEEP_TEST_SYNC_LOG:?}"
          EOF
          chmod +x "${mock_root}/fake-sync"

          common_env=(
            "BYTESWEEP_TEST_MODE=1"
            "BYTESWEEP_TEST_ROOT=${mock_root}"
            "BYTESWEEP_TEST_EFFECTIVE_UID=0"
            "BYTESWEEP_MEMINFO_FILE=${mock_root}/meminfo"
            "BYTESWEEP_VM_ROOT=${mock_root}/vm"
            "BYTESWEEP_TARGET_CGROUP=${mock_root}/cgroup"
            "BYTESWEEP_NATIVE_HELPER=${mock_root}/bytesweep-native"
            "BYTESWEEP_SYNC_COMMAND=${mock_root}/fake-sync"
            "BYTESWEEP_TEST_SYNC_LOG=${mock_root}/sync.log"
            "BYTESWEEP_TARGET_UID=1000"
            "BYTESWEEP_SETTLE_SECONDS=0"
            "BYTESWEEP_AGGRESSIVE_STABILIZE_SECONDS=1"
            "BYTESWEEP_TEST_ARGS_FILE=${mock_root}/native-args"
          )

          normal_output="$(sudo env "${common_env[@]}" ./linux/ByteSweep_Linux.sh normal)"
          grep -Fx -- '--min-rss-mb' "${mock_root}/native-args"
          grep -Fx -- '256' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-pattern' "${mock_root}/native-args"
          ! grep -Fx -- '--include-service-users' "${mock_root}/native-args"
          grep -F 'Native process page-out : pass1=done' <<< "${normal_output}"
          grep -F 'Native page-out passes  : 1' <<< "${normal_output}"
          grep -F 'drop_caches             : not requested' <<< "${normal_output}"

          smooth_output="$(sudo env "${common_env[@]}" ./linux/ByteSweep_Linux.sh smooth)"
          test "$(tr -d '\n' < "${mock_root}/vm/drop_caches")" = '1'
          grep -Fx -- '128' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-pattern' "${mock_root}/native-args"
          grep -F 'Native process page-out : pass1=done' <<< "${smooth_output}"
          grep -F 'drop_caches             : done (level 1)' <<< "${smooth_output}"
          grep -F 'cgroup memory.reclaim   : not requested' <<< "${smooth_output}"

          ai_output="$(sudo env "${common_env[@]}" ./linux/ByteSweep_Linux.sh ai-shield)"
          test "$(tr -d '\n' < "${mock_root}/vm/drop_caches")" = '1'
          test ! -s "${mock_root}/cgroup/memory.reclaim"
          grep -F 'Mode                    : ai-shield' <<< "${ai_output}"
          grep -F 'AI/GPU workloads safe   : 2' <<< "${ai_output}"
          grep -F 'drop_caches             : not requested' <<< "${ai_output}"
          grep -F 'cgroup memory.reclaim   : not requested' <<< "${ai_output}"
          grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          grep -Fx -- '--protect-pattern' "${mock_root}/native-args"

          aggressive_output="$(sudo env "${common_env[@]}" BYTESWEEP_RECLAIM_MB=1024 ./linux/ByteSweep_Linux.sh aggressive)"
          test "$(tr -d '\n' < "${mock_root}/vm/drop_caches")" = '3'
          test "$(tr -d '\n' < "${mock_root}/cgroup/memory.reclaim")" = '1073741824'
          grep -F 'drop_caches             : done (level 3)' <<< "${aggressive_output}"
          grep -F 'Native process page-out : pass1=done; pass2=done' <<< "${aggressive_output}"
          grep -F 'Native page-out passes  : 2' <<< "${aggressive_output}"
          grep -F 'Process RSS change      : +384 MB' <<< "${aggressive_output}"
          grep -F 'Measured RSS targets    : 1' <<< "${aggressive_output}"
          grep -F 'Batched native calls    : 6' <<< "${aggressive_output}"
          grep -F 'Scalar fallback calls   : 0' <<< "${aggressive_output}"
          grep -F 'cgroup memory.reclaim   : done (1024 MB requested;' <<< "${aggressive_output}"
          grep -F "Reclaim scope           : ${mock_root}/cgroup" <<< "${aggressive_output}"
          grep -Fx -- '--all-users' "${mock_root}/native-args"
          grep -Fx -- '32' "${mock_root}/native-args"
          grep -Fx -- '256' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-gpu' "${mock_root}/native-args"
          ! grep -Fx -- '--protect-pattern' "${mock_root}/native-args"
          ! grep -Fx -- '--include-service-users' "${mock_root}/native-args"

          : > "${mock_root}/cgroup/memory.reclaim"
          sudo env "${common_env[@]}" BYTESWEEP_RECLAIM_MB=1024 \
            BYTESWEEP_RECLAIM_SWAPPINESS=default \
            ./linux/ByteSweep_Linux.sh aggressive >/dev/null
          test "$(tr -d '\n' < "${mock_root}/cgroup/memory.reclaim")" = '1073741824'

          cp ./linux/ByteSweep_Linux.sh "${mock_root}/bytesweep-server"
          chmod +x "${mock_root}/bytesweep-server"
          sudo env "${common_env[@]}" BYTESWEEP_RECLAIM_MB=1024 \
            "${mock_root}/bytesweep-server" aggressive >/dev/null
          grep -Fx -- '--all-users' "${mock_root}/native-args"
          grep -Fx -- '--include-service-users' "${mock_root}/native-args"
      - name: Verify user-local launcher installation
        run: |
          install_root="${RUNNER_TEMP}/bytesweep-install"
          BYTESWEEP_BIN_DIR="${install_root}/bin" \
          BYTESWEEP_APP_DIR="${install_root}/applications" \
            ./linux/desktop/Install_Desktop.sh
          test -x "${install_root}/bin/bytesweep"
          test -x "${install_root}/bin/bytesweep-native"
          test -f "${install_root}/applications/bytesweep.desktop"
          grep -F 'Name=ByteSweep' "${install_root}/applications/bytesweep.desktop"
          grep -F 'Terminal=true' "${install_root}/applications/bytesweep.desktop"
          "${install_root}/bin/bytesweep" check
          "${install_root}/bin/bytesweep-native" check
          menu_output="$(printf '0\n' | "${install_root}/bin/bytesweep" --menu)"
          grep -F 'ByteSweep 4.1 - Linux' <<< "${menu_output}"
          ! grep -F 'Linux Server' <<< "${menu_output}"
          grep -F '3. AI Shield' <<< "${menu_output}"
          grep -F '4. Aggressive' <<< "${menu_output}"
      - name: Verify Linux server installation
        run: |
          server_bin="${RUNNER_TEMP}/bytesweep-server/bin"
          sudo env BYTESWEEP_SERVER_BIN_DIR="${server_bin}" \
            ./linux/server/Install_Server.sh
          test -x "${server_bin}/bytesweep-server"
          test -x "${server_bin}/bytesweep-native"
          test ! -e "${server_bin}/bytesweep"
          test ! -e "${server_bin}/bytesweep.desktop"
          status_output="$("${server_bin}/bytesweep-server" status)"
          grep -F 'Mode                    : status' <<< "${status_output}"
          grep -F 'Native process page-out : supported' <<< "${status_output}"
          server_menu="$(printf '0\n' | "${server_bin}/bytesweep-server" --menu)"
          grep -F 'ByteSweep 4.1 - Linux Server' <<< "${server_menu}"
          grep -F '3. AI Shield' <<< "${server_menu}"
          grep -F '4. Aggressive' <<< "${server_menu}"
